<!doctype html>
<html lang="zh-CN">
  <body style="margin: 0; background: #f5f5f5; font-family: sans-serif">
    <main
      style="
        max-width: 420px;
        margin: 32px auto;
        padding: 24px;
        border-radius: 16px;
        background: #ffffff;
      "
    >
      <h1 style="margin: 0; color: #111111; font-size: 22px">登录小智</h1>
      <p style="color: #57606a; line-height: 1.7">
        请输入下面的 6 位验证码完成登录：
      </p>
      <p
        style="
          margin: 24px 0;
          color: #4169f5;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 8px;
        "
      >
        {{ .Token }}
      </p>
      <p style="color: #8c8c8c; font-size: 13px; line-height: 1.6">
        如果不是你本人发起，请忽略这封邮件。不要把验证码转发给任何人。
      </p>
    </main>
  </body>
</html>
